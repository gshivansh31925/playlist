<style>
  :root{
    --paper: #FDF1DE;
    --card: #FFFDF8;
    --ink: #33291F;
    --soft: #8A7A66;
    --coral: #F2545B;
    --teal: #2A9D8F;
    --amber: #F4A836;
    --line: rgba(51,41,31,0.12);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(244,168,54,0.14) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(42,157,143,0.10) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }
  .stage{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
  }
  .screen{ width: 100%; max-width: 480px; display: none; }
  .screen.active{ display: block; }
  #screen-playlist.active{ max-width: 460px; }

  .eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .eyebrow::before, .eyebrow::after{
    content:""; height: 1px; width: 26px; background: var(--teal); opacity: 0.5;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.25;
    margin: 0 0 10px;
    text-align: center;
  }
  p.sub{
    color: var(--soft);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 26px;
    text-align: center;
  }
  .card{
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 24px 50px -24px rgba(51,41,31,0.35);
    overflow: hidden;
  }
  .stripes{
    display:flex; height: 6px; border-radius: 3px; overflow: hidden;
    margin: 0 auto 26px; width: 120px;
  }
  .stripes span{ flex:1; }
  .stripes span:nth-child(1){ background: var(--coral); }
  .stripes span:nth-child(2){ background: var(--amber); }
  .stripes span:nth-child(3){ background: var(--teal); }

  .cassette{ width: 210px; margin: 0 auto 26px; display: block; }
  .reel{ transform-origin: center; animation: spin 3s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- gate ---------- */
  .question{
    font-family: 'Fraunces', serif;
    font-size: 19px;
    text-align: center;
    margin: 0 0 20px;
  }
  .quiz-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-option{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s, transform 0.14s;
  }
  .quiz-option:hover{ border-color: var(--coral); }
  .quiz-option:active{ transform: scale(0.97); }
  .quiz-option:focus-visible{ outline: 2px solid var(--coral); outline-offset: 2px; }
  .quiz-option.wrong{ border-color: var(--coral); background: rgba(242,84,91,0.08); }
  .quiz-option.picked{ border-color: var(--teal); background: rgba(42,157,143,0.10); }

  .feedback{
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    color: var(--coral);
    text-align: center;
    min-height: 18px;
    margin-top: 14px;
    line-height: 1.45;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .feedback.show{ opacity: 1; }

  @keyframes shake{
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .shake{ animation: shake 0.5s; }

  .confirm{
    display: none;
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed var(--line);
  }
  .confirm.active{ display: block; }
  .confirm p{
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    line-height: 1.5;
    margin: 0 0 18px;
  }
  .btn{
    display: inline-block;
    background: var(--coral);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    transition: transform 0.14s, filter 0.18s;
  }
  .btn:hover{ filter: brightness(1.06); }
  .btn:active{ transform: scale(0.97); }
  .btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn:disabled{ opacity: 0.6; cursor: default; }
  .btn.ghost{
    background: transparent; color: var(--soft);
    border: 1.5px solid var(--line); margin-top: 10px;
  }
  .stack{ display:flex; flex-direction: column; align-items: center; }

  /* ---------- welcome / gift ---------- */
  .welcome-body{ text-align: center; }
  .w-step{ display: none; }
  .w-step.active{ display: block; }
  .welcome-body .big{
    font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; margin: 0 0 10px;
  }
  .welcome-body .mid{ color: var(--soft); font-size: 15px; margin: 0 0 26px; }
  .welcome-body .rev{ font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 18px; }

  .confetti-piece{
    position: absolute;
    width: 8px; height: 8px; border-radius: 2px;
    left: 50%; top: 40%;
    animation: burst 0.85s ease-out forwards;
    pointer-events: none;
  }
  @keyframes burst{
    to{ transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
  }

  /* ---------- cassette insertion scene ---------- */
  .cassette-scene{
    position: relative;
    height: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 24px;
  }
  .cassette-float{
    animation: floaty 2.4s ease-in-out infinite alternate;
    margin-bottom: 6px;
    width: 130px;
  }
  @keyframes floaty{ from{ transform: translateY(0); } to{ transform: translateY(-9px); } }
  .player-deck{ width: 190px; display:block; }

  /* ---------- loading ---------- */
  .loading-wrap{ text-align: center; }
  .tuner{
    font-family: 'Space Mono', monospace;
    font-size: 13px; color: var(--soft);
    height: 20px; margin-bottom: 20px;
    transition: opacity 0.25s;
  }
  .tape-track{
    width: 100%; height: 5px;
    background: rgba(51,41,31,0.1);
    border-radius: 3px; overflow: hidden; margin-bottom: 8px;
  }
  .tape-fill{
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--amber), var(--coral));
    transition: width 0.5s ease;
  }
  .counter{
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--soft); letter-spacing: 0.1em;
  }

  /* ---------- playlist screen ---------- */
  .playlist-header{ text-align: center; margin-bottom: 22px; }

  .carousel-title{
    font-family: 'Fraunces', serif;
    font-size: 19px;
    text-align: center;
    margin: 0 0 16px;
  }
  .carousel-wrap{
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: 0 auto 10px;
  }
  .carousel-viewport{
    overflow: hidden;
    border-radius: 20px;
  }
  .carousel-track{
    display: flex;
    transition: transform 0.4s cubic-bezier(.4,0,.2,1);
  }

    flex: 0 0 100%;
    width: 100%;
    box-sizing: border-box;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 20px 44px -22px rgba(51,41,31,0.4);
  }
  .car-cover{
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    margin-bottom: 14px;
    background: #1F1710;
  }

  .car-player{ margin-top: 12px; border-radius: 10px; overflow: hidden; }
  .car-player iframe{display:block;width:107%;height:392px;border:none;}

  .car-arrow{
    position: absolute;
    top: 40%;
    transform: translateY(-50%);
    z-index: 3;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,253,248,0.92);
    border: 1px solid var(--line);
    box-shadow: 0 8px 18px -8px rgba(51,41,31,0.4);

    color: var(--ink);

  }

  .car-arrow.left{ left: -8px; }
  .car-arrow.right{ right: -8px; }
  .car-arrow:disabled{ opacity: 0.3; cursor: default; }

  .car-dots{
    display: flex; justify-content: center; gap: 6px;
    margin: 14px 0 30px;
  }
  .car-dot{
    width: 6px; height: 6px; border-radius: 50%;

  }
  .car-dot.active{ background: var(--coral); transform: scale(1.3); }

<script>
  const screens = {
    gate: document.getElementById('screen-gate'),
    welcome: document.getElementById('screen-welcome'),
    loading: document.getElementById('screen-loading'),
    playlist: document.getElementById('screen-playlist')
  };
  function show(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    window.scrollTo(0, 0);
  }

  /* ---------- gate ---------- */
  document.getElementById('gateIntro').textContent = CONFIG.gate.intro + " " + CONFIG.gate.challenge;
  document.getElementById('gateQuestion').textContent = CONFIG.gate.question;

  const quizGrid = document.getElementById('quizGrid');
  const feedback = document.getElementById('feedback');
  const confirmBox = document.getElementById('confirmBox');

  CONFIG.gate.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.label;
    btn.addEventListener('click', () => handlePick(opt, btn));
    quizGrid.appendChild(btn);
  });

  function handlePick(opt, btn){
    quizGrid.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('picked'));
    if(opt.correct){
      btn.classList.add('picked');
      feedback.classList.remove('show');
      confirmBox.classList.add('active');
      document.getElementById('confirmText').textContent = CONFIG.gate.confirmText;
      document.getElementById('confirmYes').textContent = CONFIG.gate.confirmYes;
      document.getElementById('confirmNo').textContent = CONFIG.gate.confirmNo;
      confirmBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    confirmBox.classList.remove('active');
    const card = document.querySelector('#screen-gate .card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    feedback.textContent = opt.reaction || "not quite — try again";
    feedback.classList.add('show');
  }

  document.getElementById('confirmYes').addEventListener('click', goWelcome);
  document.getElementById('confirmNo').addEventListener('click', () => {
    confirmBox.classList.remove('active');
  });

  /* ---------- welcome / gift burst ---------- */
  function goWelcome(){
    document.getElementById('welcomeTitle').textContent = CONFIG.welcome.title;
    document.getElementById('welcomeBody').textContent = CONFIG.welcome.body;
    document.getElementById('giftLine').textContent = CONFIG.welcome.giftLine;
    document.getElementById('openGiftBtn').textContent = CONFIG.welcome.openBtn;
    document.getElementById('revealLine').textContent = CONFIG.welcome.revealLine;
    document.getElementById('openPlaylistBtn').textContent = CONFIG.welcome.openPlaylistBtn;
    show('welcome');
  }

  document.getElementById('openGiftBtn').addEventListener('click', () => {
    burstConfetti(document.getElementById('welcomeCard'));
    setTimeout(() => {
      document.getElementById('wStep1').classList.remove('active');
      document.getElementById('wStep2').classList.add('active');
    }, 500);
  });

  document.getElementById('openPlaylistBtn').addEventListener('click', (e) => {
    e.target.disabled = true;
    const cass = document.getElementById('cassetteFloat');
    cass.style.animation = 'insertCassette 0.75s ease forwards';
    cass.addEventListener('animationend', goLoading, { once: true });
  });

  function burstConfetti(container){
    const colors = ['#F2545B', '#F4A836', '#2A9D8F'];
    for(let i = 0; i < 26; i++){
      const el = document.createElement('span');
      el.className = 'confetti-piece';
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 90;
      el.style.setProperty('--x', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--y', Math.sin(angle) * dist + 'px');
      el.style.setProperty('--r', (Math.random() * 360) + 'deg');
      el.style.background = colors[i % colors.length];
      container.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }
</script>

<script>
  /* ---------- loading ---------- */
  function goLoading(){
    show('loading');
    const tuner = document.getElementById('tunerText');
    const fill = document.getElementById('tapeFill');
    const counter = document.getElementById('counterText');
    const msgs = CONFIG.loadingMessages;
    let i = 0, seconds = 0;

    const counterInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,'0');
      const s = String(seconds%60).padStart(2,'0');
      counter.textContent = m + ':' + s;
    }, 1000);

    function next(){
      tuner.style.opacity = 0;
      setTimeout(() => {
        tuner.textContent = msgs[i];
        tuner.style.opacity = 1;
        fill.style.width = (((i+1) / msgs.length) * 100) + '%';
        i++;
        if(i < msgs.length){
          setTimeout(next, 900);
        } else {
          setTimeout(() => { clearInterval(counterInterval); goPlaylist(); }, 750);
        }
      }, 200);
    }
    next();
  }

  /* ---------- playlist ---------- */
  const COVER_HUES = ['#F2545B', '#F4A836', '#2A9D8F', '#E07A5F', '#3D8C8C', '#E9967A'];
  let carIndex = 0;
  let carItems = [];

  function makeCoverHtml(track, idx){ return ''; }

  function renderCarousel(){
    const track = document.getElementById('carTrack');
    const dots = document.getElementById('carDots');
    carItems = CONFIG.carouselOrder
      .map(title => CONFIG.tracks.find(t => t.title === title))
      .filter(Boolean);

    carItems.forEach((t, idx) => {
      const slide = document.createElement('div');
      slide.className = 'car-slide';
      const playerHtml = t.spotifyTrackId
        ? `<div class="car-player"><iframe src="https://open.spotify.com/embed/track/${t.spotifyTrackId}?theme=0" width="100%" height="392" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`
        : '';
slide.innerHTML=`${playerHtml}<p class="car-title">${t.title}</p><p class="car-artist">${t.artist}</p><div class="car-note-wrap"><p class="car-note">${t.note||''}</p></div>`;
      track.appendChild(slide);

      const dot = document.createElement('span');
      dot.className = 'car-dot';
      dots.appendChild(dot);
    });

    updateCarousel();
  }

  function updateCarousel(){
    const track = document.getElementById('carTrack');
    track.style.transform = `translateX(-${carIndex * 100}%)`;
    document.querySelectorAll('.car-dot').forEach((d, i) => d.classList.toggle('active', i === carIndex));
    document.getElementById('carPrev').disabled = carIndex === 0;
    document.getElementById('carNext').disabled = carIndex === carItems.length - 1;
  }

  document.getElementById('carPrev').addEventListener('click', () => {
    if(carIndex > 0){ carIndex--; updateCarousel(); }
  });
  document.getElementById('carNext').addEventListener('click', () => {
    if(carIndex < carItems.length - 1){ carIndex++; updateCarousel(); }
  });

  function goPlaylist(){
    document.getElementById('playlistTitle').textContent = `A mixtape for ${CONFIG.herName}`;
    document.getElementById('carouselTitle').textContent = CONFIG.carouselTitle;
    document.getElementById('noteText').textContent = CONFIG.noteParagraph;
    document.getElementById('fullListTitle').textContent = CONFIG.fullListTitle;
    document.getElementById('fullListSub').textContent = CONFIG.fullListSub;
    document.getElementById('fullEmbed').src = `https://open.spotify.com/embed/playlist/${CONFIG.playlistId}?utm_source=generator`;
    const spotifyBtn = document.getElementById('spotifyBtn');
    spotifyBtn.textContent = CONFIG.spotifyBtn;
    spotifyBtn.href = `https://open.spotify.com/playlist/${CONFIG.playlistId}`;

    renderCarousel();
    show('playlist');
  }
</script>
